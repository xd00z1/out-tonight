# Curated pages to check. One row per source.
#
# method:
#   ics     - an iCalendar feed (feed_url)
#   tribe   - WordPress "The Events Calendar" REST API (feed_url)
#   jsonld  - schema.org Event blocks embedded in the page HTML (url)
#   nextdata - title + start date objects in a Next.js page's __NEXT_DATA__ (url)
#   link    - no machine-readable events found; shown on the page as a
#             "worth checking" link, never parsed
#
# probe.py fills in method/feed_url; edit by hand afterwards if needed.
# Defaults apply when a source doesn't state cost or guest policy.

defaults:
  max_events: 15
  default_cost_tier: null   # unknown unless the source states it
  default_guest_ok: null
  enabled: true
  # Titles matching this regex are dropped from every source (a source's own
  # `exclude` is applied in addition).
  exclude: '\bsold out\b|\bonline\b|\bvirtual\b|webinar|\bzoom\b|\bcourse\b|\bclass(es)?\b|mixed level'

