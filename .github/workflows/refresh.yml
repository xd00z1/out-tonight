name: refresh

on:
  schedule:
    # 10:00 UTC = 6am Eastern in summer, 5am in winter. Mondays and Thursdays.
    - cron: "0 10 * * 1,4"
  workflow_dispatch:
  push:
    branches: [main]  # includes the monthly local run's data push; the bot's own pushes never retrigger

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # latest main, not the commit that queued this run
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - name: Re-import Carnegie and Met schedules (keeps last files if blocked)
        run: |
          python importers/carnegie.py || true
          python importers/met_opera.py || true
      - run: python refresh.py
      - name: Alerts (Resend email if set up, else GitHub issue; ntfy push if NTFY_TOPIC is set)
        env:
          GH_TOKEN: ${{ github.token }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
        run: |
          python tools/alerts.py > alerts.md || true
          if [ -s alerts.md ] && [ -n "$RESEND_API_KEY" ] && [ -n "$ALERT_EMAIL" ]; then
            python tools/send_email.py alerts.md
          elif [ -s alerts.md ]; then
            n=$(grep -c '^- ' alerts.md)
            gh label create alert-digest --color c2410c --force >/dev/null 2>&1 || true
            gh issue create --title "Out Tonight: $n new match(es)" --body-file alerts.md               --assignee "${{ github.repository_owner }}" --label alert-digest || true
          fi
          if [ -s alerts.md ] && [ -n "$NTFY_TOPIC" ]; then
            n=$(grep -c '^- ' alerts.md)
            grep '^- ' alerts.md | head -5 | sed -e 's/ · \[link\].*//' -e 's/\*\*//g' -e 's/^- //'                 | curl -s -H "Title: Out Tonight: $n new" -H "Click: https://${{ github.repository_owner }}.github.io/out-tonight/"                   --data-binary @- "https://ntfy.sh/$NTFY_TOPIC" >/dev/null || true
          fi
      - name: Commit regenerated files
        run: |
          git config user.name "refresh-bot"
          git config user.email "refresh-bot@users.noreply.github.com"
          git add public seed_carnegie.json seed_met.json alerts_state.json 2>/dev/null || git add public seed_carnegie.json seed_met.json
          git diff --cached --quiet || git commit -m "refresh $(TZ=America/New_York date +%F)"
          # Another run may have pushed meanwhile; this run's data is newer, so keep it.
          git pull --rebase -X theirs origin main
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
