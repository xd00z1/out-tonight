# Standing weekly/monthly options, expanded into dated instances for the next 30 days.
# All come out as confidence: carried. Confirm hours on the venue page now and then.
#
# Rule keys:
#   days: [mon..sun]        weekdays it happens (default: every day)
#   nth: [1]                only the nth such weekday of the month (1 = first)
#   monthday: 1             a fixed day of the month instead of weekdays
#   except_months: [1, 9]   skip these months
#   from / until            date bounds (inclusive)
#   time / end              "HH:MM" 24h; omit time when the source gives none -> all-day
#   kind: on_sale           ticket release rather than an event

