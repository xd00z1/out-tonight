<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Out Tonight</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='9' fill='%23c2410c'/></svg>">
<style>
:root {
  --bg: #f7f5f0; --surface: #fff; --ink: #1a1916; --muted: #8a857a; --line: #e6e2d8;
  --accent: #c2410c; --chip: #ece8de; --on: #1a1916; --on-ink: #f7f5f0;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131210; --surface: #1c1b18; --ink: #f1eee6; --muted: #8f8a80; --line: #2b2925;
    --accent: #fb923c; --chip: #25231f; --on: #f1eee6; --on-ink: #131210; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131210; --surface: #1c1b18; --ink: #f1eee6; --muted: #8f8a80; --line: #2b2925;
  --accent: #fb923c; --chip: #25231f; --on: #f1eee6; --on-ink: #131210; color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.4 var(--sans); }
a { color: inherit; text-decoration: none; }
button, select { font: inherit; color: inherit; }
.wrap { max-width: 560px; margin: 0 auto; padding: 0 16px calc(40px + env(safe-area-inset-bottom)); }

.top { display: flex; align-items: center; justify-content: space-between; padding: 18px 0 12px; gap: 12px; }
h1 { font: 600 24px/1 var(--serif); margin: 0; }
.seg { display: flex; background: var(--chip); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: none; padding: 6px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); box-shadow: 0 1px 2px rgb(0 0 0 / .12); }

.filters { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px 12px; }
.filters::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 0; background: var(--chip); padding: 7px 11px; border-radius: 999px; font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--on); color: var(--on-ink); }
select.chip { appearance: none; -webkit-appearance: none; padding-right: 22px;
  background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
  background-position: calc(100% - 12px) 50%, calc(100% - 8px) 50%; background-size: 4px 4px; background-repeat: no-repeat; }
.sep { flex: none; width: 1px; background: var(--line); margin: 4px 2px; }

/* calendar */
.month { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 8px; }
.month h2 { font: 600 17px/1 var(--sans); margin: 0; }
.nav { border: 0; background: none; font-size: 22px; line-height: 1; padding: 4px 10px; cursor: pointer; color: var(--muted); }
.nav:disabled { opacity: .25; cursor: default; }
.grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.dow { text-align: center; font-size: 11px; font-weight: 600; color: var(--muted); padding-bottom: 4px; }
.day { aspect-ratio: 1 / 1; border: 0; background: none; border-radius: 10px; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 4px; cursor: pointer; font-size: 15px; font-variant-numeric: tabular-nums; padding: 0; }
.day.out { visibility: hidden; }
.day.past { color: var(--muted); opacity: .45; }
.day.today .n { color: var(--accent); font-weight: 700; }
.day[aria-pressed="true"] { background: var(--on); color: var(--on-ink); }
.day[aria-pressed="true"] .n { color: inherit; }
.dots { display: flex; gap: 3px; height: 5px; }
.dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
.day[aria-pressed="true"] .dots i { background: var(--on-ink); }

/* lists */
.dayhead { font: 600 13px/1 var(--sans); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 22px 0 6px; }
.list.all .dayhead { position: sticky; top: 0; background: var(--bg); padding: 8px 0 6px; margin: 14px 0 0; z-index: 1; }
.row { display: flex; align-items: flex-start; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.t { flex: none; width: 52px; font-size: 13px; color: var(--muted); padding-top: 1px; font-variant-numeric: tabular-nums; }
.main { flex: 1; min-width: 0; }
.title { font-weight: 600; overflow-wrap: anywhere; }
.sub { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; margin-top: 1px; }
.tag { display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase;
  padding: 2px 5px; border-radius: 4px; background: var(--chip); color: var(--ink); margin-left: 6px; vertical-align: 2px; }
.tag.hot { background: var(--accent); color: #fff; }
.add { flex: none; width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center;
  color: var(--muted); font-size: 18px; line-height: 1; margin-top: -2px; }
.add:hover { color: var(--ink); border-color: var(--ink); }
.standing .title { font-weight: 500; }
.standing .row { padding: 8px 0; }
.empty { color: var(--muted); font-size: 14px; padding: 10px 0; }
footer { margin-top: 32px; font-size: 12px; color: var(--muted); text-align: center; }
footer a { text-decoration: underline; }
.more { margin-top: 28px; font-size: 13px; }
.more summary { cursor: pointer; color: var(--muted); list-style: none; text-align: center; }
.more summary::-webkit-details-marker { display: none; }
.more .links { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.more .grp { margin-top: 14px; }
.more .gl { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.more .links a { background: var(--chip); padding: 6px 10px; border-radius: 999px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>Out Tonight</h1>
    <div class="seg" role="group" aria-label="View">
      <button type="button" data-view="cal" aria-pressed="true">Calendar</button>
      <button type="button" data-view="all" aria-pressed="false">All</button>
    </div>
  </div>
  <div class="filters" id="filters"></div>
  <div id="view"></div>
  <details class="more" id="more" hidden><summary>More calendars</summary><div id="moreLinks"></div></details>
  <footer id="foot"></footer>
</div>

<script>
const TZ = "America/New_York";
const NEAR = ["Tribeca", "SoHo", "Hudson Square", "FiDi", "West Village"];
const CATS = { openings: "Openings", museums: "Museums", fairs: "Fairs", opera_classical: "Classical & opera",
  jazz_music: "Music", film: "Film", performance: "Performance", books_talks: "Talks & books", institutes: "Institutes",
  fashion_design: "Fashion & design", watches_jewelry: "Watches & jewelry", parties_benefits: "Parties",
  food_wine: "Food & wine", nightlife: "Nightlife", audio_vinyl: "Vinyl & audio" };

const load = () => { try { return JSON.parse(localStorage.getItem("ot") || "{}"); } catch { return {}; } };
const save = () => { try { localStorage.setItem("ot", JSON.stringify({ f, view })); } catch {} };
const saved = load();
let f = Object.assign({ price: null, entry: [], near: false, cat: "" }, saved.f);
let view = saved.view || "cal";
let DATA = { events: [] }, today, selected, month;

// ---- dates, all in New York wall time
const nyDate = d => new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit" }).format(d);
const add = (ymd, n) => { const d = new Date(ymd + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const span = (a, b) => Math.round((new Date(b + "T12:00:00Z") - new Date(a + "T12:00:00Z")) / 864e5);
const label = (ymd, o) => new Date(ymd + "T12:00:00Z").toLocaleDateString("en-US", { timeZone: "UTC", ...o });
const time = iso => new Date(iso).toLocaleTimeString("en-US", { timeZone: TZ, hour: "numeric", minute: "2-digit" }).replace(":00", "").replace(" ", "").toLowerCase();
const sd = e => e.start.slice(0, 10);
const ed = e => e.multi_day_end || sd(e);

// Which days an event shows on. Runs over a month appear only on opening and closing day.
function onDay(e, d) {
  if (!e.multi_day_end) return sd(e) === d;
  if (span(sd(e), ed(e)) > 31) return d === sd(e) || d === ed(e);
  return d >= sd(e) && d <= ed(e);
}

function passes(e) {
  if (f.price === "free" && e.price_min !== 0) return false;
  if (f.price && f.price !== "free" && !(e.price_min != null && e.price_min <= +f.price)) return false;
  if (f.entry.length && !f.entry.includes(e.entry)) return false;
  if (f.near && !NEAR.includes(e.neighborhood)) return false;
  if (f.cat && e.category !== f.cat) return false;
  return true;
}

function ended(e) {
  if (e.all_day || (e.multi_day_end && e.multi_day_end > today)) return false;
  const end = e.end ? new Date(e.end) : new Date(new Date(e.start).getTime() + 2 * 3600e3);
  return end < new Date();
}

const h = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") n.className = v; else if (k === "text") n.textContent = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null && k !== false && k !== "") n.append(k);
  return n;
};

// ---- filters
function renderFilters() {
  const chip = (text, on, click) => h("button", { class: "chip", type: "button", "aria-pressed": String(!!on), text, onclick: () => { click(); save(); render(); } });
  const price = v => chip(v === "free" ? "Free" : `≤ $${v}`, f.price === v, () => f.price = f.price === v ? null : v);
  const entry = (v, t) => chip(t, f.entry.includes(v), () => f.entry = f.entry.includes(v) ? f.entry.filter(x => x !== v) : [...f.entry, v]);
  const present = new Set(DATA.events.map(e => e.category));
  const cat = h("select", { class: "chip", "aria-label": "Type", onchange: ev => { f.cat = ev.target.value; save(); render(); } },
    h("option", { value: "", text: "All types" }),
    ...Object.entries(CATS).filter(([k]) => present.has(k)).map(([k, t]) => h("option", { value: k, text: t, selected: f.cat === k ? "" : null })));
  if (f.cat) cat.setAttribute("aria-pressed", "true");
  document.getElementById("filters").replaceChildren(
    price("free"), price("25"), price("50"), h("span", { class: "sep" }),
    entry("walk_in", "Walk in"), entry("rsvp", "RSVP"), entry("ticket", "Ticket"), h("span", { class: "sep" }),
    chip("Near home", f.near, () => f.near = !f.near), cat);
}

// ---- rows
function row(e, d) {
  let t;
  if (e.kind === "on_sale") t = e.all_day ? "" : time(e.start);
  else if (e.multi_day_end && span(sd(e), ed(e)) > 31) t = d === ed(e) ? "Last day" : "Opens";
  else t = e.all_day ? "" : time(e.start);
  const tags = [
    e.kind === "on_sale" && h("span", { class: "tag hot", text: "On sale" }),
    e.entry === "rsvp" && h("span", { class: "tag", text: "RSVP" }),
    e.age_min && h("span", { class: "tag", text: e.age_min + "+" }),
    e.confidence === "projected" && h("span", { class: "tag", text: "Est. date" })
  ];
  const cost = e.cost_text === "Not stated" ? null : e.cost_text;
  const thru = e.multi_day_end && span(sd(e), ed(e)) <= 31 ? "thru " + label(ed(e), { month: "short", day: "numeric" }) : null;
  const sub = [e.venue || e.neighborhood, cost, thru].filter(Boolean).join(" · ");
  return h("div", { class: "row" },
    h("div", { class: "t", text: t }),
    h("a", { class: "main", href: e.url, target: "_blank", rel: "noopener" },
      h("div", { class: "title" }, e.title, tags), sub && h("div", { class: "sub", text: sub })),
    h("a", { class: "add", href: e.gcal_url, target: "_blank", rel: "noopener", title: "Add to Google Calendar", "aria-label": "Add to Google Calendar", text: "+" }));
}

function eventsOn(d) {
  const evs = DATA.events.filter(e => onDay(e, d) && passes(e) && !(d === today && ended(e)));
  const order = e => (e.all_day ? "99" : e.start.slice(11, 16));
  evs.sort((a, b) => (order(a) < order(b) ? -1 : order(a) > order(b) ? 1 : 0));
  return { picks: evs.filter(e => !e.recurring), standing: evs.filter(e => e.recurring) };
}

// ---- calendar view
function renderCal() {
  const first = month + "-01";
  const start = add(first, -new Date(first + "T12:00:00Z").getUTCDay());
  const cells = [];
  for (let i = 0; i < 42; i++) {
    const d = add(start, i);
    if (i >= 35 && d.slice(0, 7) !== month) break;
    const inMonth = d.slice(0, 7) === month;
    const n = inMonth ? eventsOn(d).picks.length : 0;
    cells.push(h("button", {
      type: "button", class: "day" + (inMonth ? "" : " out") + (d < today ? " past" : "") + (d === today ? " today" : ""),
      "aria-pressed": String(d === selected), "aria-label": label(d, { weekday: "long", month: "long", day: "numeric" }) + (n ? `, ${n} events` : ""),
      onclick: () => { selected = d; render(); }
    }, h("span", { class: "n", text: +d.slice(8) }), h("span", { class: "dots" }, Array.from({ length: Math.min(n, 3) }, () => h("i")))));
  }
  const months = DATA.events.map(sd).concat([today]).sort();
  const minM = today.slice(0, 7), maxM = months[months.length - 1].slice(0, 7);
  const shift = k => { const d = new Date(month + "-15T12:00:00Z"); d.setUTCMonth(d.getUTCMonth() + k); month = d.toISOString().slice(0, 7);
    selected = month === today.slice(0, 7) ? today : month + "-01"; render(); };
  const { picks, standing } = eventsOn(selected);
  const isToday = selected === today;
  return [
    h("div", { class: "month" },
      h("button", { class: "nav", type: "button", "aria-label": "Previous month", disabled: month <= minM ? "" : null, onclick: () => shift(-1), text: "‹" }),
      h("h2", { text: label(month + "-15", { month: "long", year: "numeric" }) }),
      h("button", { class: "nav", type: "button", "aria-label": "Next month", disabled: month >= maxM ? "" : null, onclick: () => shift(1), text: "›" })),
    h("div", { class: "grid" }, ..."SMTWTFS".split("").map(c => h("div", { class: "dow", text: c })), ...cells),
    h("div", { class: "dayhead", text: isToday ? "Tonight" : label(selected, { weekday: "long", month: "short", day: "numeric" }) }),
    h("div", { class: "list" }, picks.length ? picks.map(e => row(e, selected)) : h("div", { class: "empty", text: "Nothing dated. Standing options below." })),
    standing.length && h("div", { class: "dayhead", text: "Any week" }),
    standing.length && h("div", { class: "list standing" }, standing.map(e => row(e, selected)))
  ];
}

// ---- all view
function renderAll() {
  const out = [];
  const last = DATA.events.map(ed).sort().pop() || today;
  for (let d = today; d <= last; d = add(d, 1)) {
    const picks = DATA.events.filter(e => passes(e) && !e.recurring && (e.multi_day_end ? (d === sd(e) || (d === today && sd(e) < today && ed(e) >= today)) : sd(e) === d) && !(d === today && ended(e)));
    if (!picks.length) continue;
    out.push(h("div", { class: "dayhead", text: d === today ? "Today" : label(d, { weekday: "short", month: "short", day: "numeric" }) }),
      ...picks.map(e => row(e, d)));
  }
  return [h("div", { class: "list all" }, out.length ? out : h("div", { class: "empty", text: "Nothing matches these filters." }))];
}

function render() {
  document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.view === view)));
  renderFilters();
  document.getElementById("view").replaceChildren(...(view === "cal" ? renderCal() : renderAll()).filter(Boolean));
}

document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => { view = b.dataset.view; save(); render(); }));

(async () => {
  try {
    const [ev, st] = await Promise.all([
      fetch("events.json", { cache: "no-cache" }).then(r => r.json()),
      fetch("status.json", { cache: "no-cache" }).then(r => r.json()).catch(() => null)]);
    DATA = ev;
    today = nyDate(new Date()); selected = today; month = today.slice(0, 7);
    render();
    const ACR = new Set("nyc ny icp moma ps1 nypl bpl mad amnh nyas bac nyla nytw cmslc msm lmcc flc bam pac gsapp fit kccny iscp lpr mcny bpca cuny gc ifc hb".split(" "));
    const FIX = { ny92: "92NY", moma: "MoMA", moma_ps1: "MoMA PS1", joes_pub: "Joe's Pub", mintons: "Minton's",
      kgb_bar: "KGB Bar", pi_fyi: "PI.FYI", docnyc: "DOC NYC", lalliance: "L'Alliance", sothebys_ny: "Sotheby's",
      bk_bridge_park: "Brooklyn Bridge Park", met_events: "The Met", ps122: "PS122", here_arts: "HERE",
      mcnally_jackson: "McNally Jackson", st_barts: "St. Bart's", the_skint: "The Skint", sculpturecenter: "SculptureCenter" };
    const name = b => b.name || FIX[b.id] || (b.id.split("_").map(w => ACR.has(w) ? w.toUpperCase() : w[0].toUpperCase() + w.slice(1)).join(" "));
    const byCat = {};
    for (const b of ev.browse || []) (byCat[b.category] ||= []).push(b);
    document.getElementById("moreLinks").replaceChildren(...Object.keys(CATS).filter(k => byCat[k]).map(k =>
      h("div", { class: "grp" }, h("div", { class: "gl", text: CATS[k] }),
        h("div", { class: "links" }, byCat[k].sort((a, b) => name(a).localeCompare(name(b)))
          .map(b => h("a", { href: b.url, target: "_blank", rel: "noopener", title: b.note || "", text: name(b) }))))));
    document.getElementById("more").hidden = !(ev.browse || []).length;
    const upd = new Date(ev.generated_at).toLocaleDateString("en-US", { timeZone: TZ, weekday: "short", month: "short", day: "numeric" });
    // A source GitHub can't reach still counts as fine if the monthly local run reached it recently.
    const cutoff = new Date(Date.now() - 40 * 864e5).toISOString().slice(0, 10);
    const stale = st ? st.sources.filter(x => x.result === "failed" && !(x.last_success && x.last_success >= cutoff)).length : 0;
    const failed = stale ? ` · ${stale} sources failing` : "";
    const feed = new URL("calendar.ics", location.href).href;
    document.getElementById("foot").replaceChildren(`Updated ${upd}${failed} · `, h("a", { href: feed, text: "Calendar feed" }));
  } catch {
    document.getElementById("view").textContent = "Couldn't load events.json.";
  }
})();
</script>
</body>
</html>
